name: Renderer validation (baseline vs patched)

# Compiles the REAL vc_render_tifxyz twice from the same pinned villa commit --
# once unmodified, once with patch/vc_render_tifxyz.patch applied -- and renders
# both against the same public segment and volume, so the physical-scale metadata
# they emit can be compared.
#
# Why GitHub-hosted runners: the development machine's sandbox cannot start a
# compiler through CMake or Ninja (see DOCS/RESULTS.md section 8.4), and the
# prebuilt MSYS2/vcpkg dependency bundles upstream CI uses are not anonymously
# readable (HTTP 403 from ghcr.io). This workflow therefore installs the
# dependencies from the same public apt list upstream's own
# scripts/install_build_deps.sh uses. No private registry and no credentials
# beyond the automatic GITHUB_TOKEN are needed.
#
# Manual or push-triggered only: no schedule, so it cannot loop.

on:
  workflow_dispatch:
    inputs:
      villa_commit:
        description: 'villa commit to build (default: the commit this project pins)'
        required: false
        type: string
        default: '757f70c0140a4cfbbbd44975ef09558444b96980'
      full_build:
        description: 'Build the whole tree instead of just the renderer target'
        required: false
        type: boolean
        default: false
  push:
    branches: [ci/renderer-validation]
    paths:
      - '.github/workflows/renderer-validation.yml'
      - 'patch/vc_render_tifxyz.patch'
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: renderer-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  VILLA_COMMIT: ${{ inputs.villa_commit || '757f70c0140a4cfbbbd44975ef09558444b96980' }}
  # install_build_deps.sh installs AWS CLI v2 to /usr/local/bin; make sure later
  # steps see it even if PATH is not refreshed between actions.
  PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  validate:
    name: Build + render (baseline vs patched)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout VoxelScaleGuard
        uses: actions/checkout@v4

      - name: Record toolchain and the pinned revision
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p ci-out
          {
            echo "runner_image: $(lsb_release -ds 2>/dev/null || head -2 /etc/os-release | tr '\n' ' ')"
            echo "kernel: $(uname -srm)"
            echo "cpus: $(nproc)"
            echo "memory: $(free -h | awk '/^Mem:/{print $2}')"
            echo "gcc: $(gcc --version | head -1)"
            echo "cmake: $(cmake --version | head -1)"
            echo "ninja: $(ninja --version)"
            echo "villa_commit: ${VILLA_COMMIT}"
          } | tee ci-out/toolchain.txt

      - name: Clone villa at the pinned commit
        # Fetch just the pinned commit instead of the whole history: the clone
        # plus detached checkout took 200 s on a hosted runner, which is pure
        # overhead when the tree and the one commit are all that is needed.
        run: |
          set -euo pipefail
          mkdir -p villa-src
          git -C villa-src init -q
          git -C villa-src remote add origin https://github.com/ScrollPrize/villa.git
          git -C villa-src fetch -q --depth 1 origin "${VILLA_COMMIT}"
          git -C villa-src checkout -q --detach FETCH_HEAD
          git -C villa-src rev-parse HEAD | tee ci-out/villa-HEAD.txt
          test "$(cat ci-out/villa-HEAD.txt)" = "${VILLA_COMMIT}"
          git -C villa-src log -1 --format='%H %ad %s' --date=iso | tee ci-out/villa-commit.txt
          git -C villa-src status --porcelain | tee ci-out/villa-status-clean.txt
          test -z "$(cat ci-out/villa-status-clean.txt)"

      - name: Enable the universe repository and update package lists
        # apt must genuinely work before anything else is worth attempting. If
        # `apt-get update` fails, every later `apt-get install` fails instantly
        # with no error of its own, which looks like "all packages unavailable"
        # and sends you hunting for the wrong problem.
        run: |
          set -uo pipefail
          sudo add-apt-repository -y universe > ci-out/apt-update.log 2>&1
          echo "--- add-apt-repository: $? ---" >> ci-out/apt-update.log

          set +e
          sudo apt-get update -y >> ci-out/apt-update.log 2>&1
          UPDATE_RC=$?
          set -e
          echo "apt-get update exit code: ${UPDATE_RC}" | tee ci-out/apt-update-status.txt
          tail -30 ci-out/apt-update.log
          echo "--- repository errors ---"
          grep -E "^(Err|E:|W:)" ci-out/apt-update.log | head -30 || echo "(none)"

          if [ "$UPDATE_RC" -ne 0 ]; then
            echo "apt-get update FAILED (rc=${UPDATE_RC}). Retrying with the"
            echo "distribution's default mirror definition."
            sudo rm -rf /etc/apt/sources.list.d/* 2>/dev/null || true
            set +e
            printf 'deb http://archive.ubuntu.com/ubuntu %s main restricted universe multiverse\ndeb http://archive.ubuntu.com/ubuntu %s-updates main restricted universe multiverse\ndeb http://security.ubuntu.com/ubuntu %s-security main restricted universe multiverse\n' \
              "$(lsb_release -cs)" "$(lsb_release -cs)" "$(lsb_release -cs)" \
              | sudo tee /etc/apt/sources.list > /dev/null
            sudo apt-get update -y >> ci-out/apt-update.log 2>&1
            UPDATE_RC=$?
            set -e
            echo "retry apt-get update exit code: ${UPDATE_RC}" \
              | tee -a ci-out/apt-update-status.txt
          fi

          # Prove apt can actually resolve a package before the install step.
          set +e
          apt-cache policy cmake libopencv-dev libtiff-dev | tee ci-out/apt-cache-policy.txt
          CAND=$(apt-cache policy cmake | awk '/Candidate:/{print $2}')
          set -e
          echo "apt candidate for cmake: ${CAND:-<none>}" | tee -a ci-out/apt-update-status.txt
          if [ -z "$CAND" ] || [ "$CAND" = "(none)" ]; then
            echo "FATAL: apt cannot resolve even cmake; package lists are unusable."
            exit 1
          fi

      - name: apt diagnostics (does apt work at all on this runner?)
        run: |
          set -x
          id
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: no"
          ls -l /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>&1 || true
          sudo fuser -v /var/lib/dpkg/lock-frontend 2>&1 || true
          apt-cache policy cmake ninja-build libopencv-dev libtiff-dev libboost-program-options-dev 2>&1 | head -40

      - name: Install upstream's dependency list (apt)
        # The package list is upstream's own scripts/install_build_deps.sh, which
        # is what their CI image is built from. It is executed here package-group
        # by package-group instead of via the script, because the script's `set -e`
        # aborts on the first unavailable package and hides which one it was.
        # Every group reports its own exit code; only the final verify step
        # decides whether the build can proceed.
        run: |
          set -uo pipefail
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo systemctl disable unattended-upgrades.service 2>/dev/null || true

          sudo apt-get update -y > ci-out/apt-update-2.log 2>&1
          echo "second apt-get update exit: $?" | tee ci-out/apt-groups.txt

          # Format is "<arbitrary label> <package> <package> ...". The label is
          # dropped by the first `read`; the rest are the package names. A ':' or
          # ',' separator would be wrong here -- package names contain neither, so
          # a wrong separator silently yields the whole string as one bogus name.
          # One group per line: "<label> <package> <package> ...". Read with a
          # here-doc rather than a bash array, because an array element that fails
          # to expand yields a silently wrong package name, and apt then reports
          # "unable to locate" for something that was never a package.
          while read -r name pkgs; do
            [ -z "$name" ] && continue
            echo "--- group ${name}: ${pkgs}"
            set +e
            # shellcheck disable=SC2086  # word splitting is the point here
            sudo apt-get install -y --no-install-recommends $pkgs \
              > "ci-out/apt-${name}.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "OK    ${name}: ${pkgs}" | tee -a ci-out/apt-groups.txt
            else
              echo "FAIL(${rc}) ${name}: ${pkgs}" | tee -a ci-out/apt-groups.txt
              grep -E "^E:" "ci-out/apt-${name}.log" | head -5 | sed 's/^/        /' \
                | tee -a ci-out/apt-groups.txt
            fi
          done <<'GROUPS'
          toolchain clang lld llvm mold ccache pkg-config
          cmake ninja-build
          qt6 qt6-base-dev
          boost libboost-system-dev libboost-program-options-dev
          ceres libceres-dev libsuitesparse-dev
          opencv libopencv-dev libopencv-contrib-dev
          cgal libcgal-dev libmpfr-dev libgmp-dev
          compression libblosc-dev libzstd-dev liblz4-dev zlib1g-dev
          network libcurl4-openssl-dev
          json nlohmann-json3-dev
          tiff libtiff-dev
          misc libavahi-client-dev file bzip2 wget jq
          blas gfortran libopenblas-dev liblapack-dev liblapacke-dev libomp-dev
          scotch libscotch-dev libscotchmetis-dev libhwloc-dev
          flang flang-21 libclang-rt-21-dev
          GROUPS

          # Record, for every package, whether dpkg thinks it is installed.
          : > ci-out/package-presence.txt
          while read -r name pkgs; do
            [ -z "$name" ] && continue
            for pkg in $pkgs; do
              if dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "ok installed"; then
                printf 'present  %s\n' "$pkg" >> ci-out/package-presence.txt
              else
                printf 'MISSING  %s\n' "$pkg" >> ci-out/package-presence.txt
              fi
            done
          done <<'GROUPS'
          toolchain clang lld llvm mold ccache pkg-config
          cmake ninja-build
          qt6 qt6-base-dev
          boost libboost-system-dev libboost-program-options-dev
          ceres libceres-dev libsuitesparse-dev
          opencv libopencv-dev libopencv-contrib-dev
          cgal libcgal-dev libmpfr-dev libgmp-dev
          compression libblosc-dev libzstd-dev liblz4-dev zlib1g-dev
          network libcurl4-openssl-dev
          json nlohmann-json3-dev
          tiff libtiff-dev
          misc libavahi-client-dev file bzip2 wget jq
          blas gfortran libopenblas-dev liblapack-dev liblapacke-dev libomp-dev
          scotch libscotch-dev libscotchmetis-dev libhwloc-dev
          flang flang-21 libclang-rt-21-dev
          GROUPS
          echo "--- package presence summary ---"
          sort ci-out/package-presence.txt | tee ci-out/package-presence-sorted.txt
          echo "present: $(grep -c '^present' ci-out/package-presence.txt) / total: $(wc -l < ci-out/package-presence.txt)"
          exit 0

      - name: Verify the renderer's dependency closure (reported, never fatal)
        # Reports rather than fails: if something is missing, cmake's own error
        # message is a far better diagnostic than a package-name check, and the
        # configure step will produce it. Hard-gating here only destroys the log.
        run: |
          set -uo pipefail
          echo "--- renderer closure ---" | tee ci-out/verify-deps.txt
          for pkg in libopencv-dev libtiff-dev libboost-program-options-dev cmake ninja-build; do
            v=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)
            if [ -n "$v" ]; then
              echo "present: $pkg $v" | tee -a ci-out/verify-deps.txt
            else
              echo "MISSING: $pkg" | tee -a ci-out/verify-deps.txt
            fi
          done
          echo "--- configure-time requirements of the project as a whole ---" \
            | tee -a ci-out/verify-deps.txt
          for pkg in libceres-dev libcgal-dev qt6-base-dev; do
            v=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)
            echo "${pkg}: ${v:-MISSING}" | tee -a ci-out/verify-deps.txt
          done
          echo "--- bare tool versions ---" | tee -a ci-out/verify-deps.txt
          { cmake --version | head -1; ninja --version; g++ --version | head -1; } \
            2>&1 | tee -a ci-out/verify-deps.txt
          exit 0

      # ---------------------------------------------------------------------
      # Baseline: the pinned revision, unmodified.
      # ---------------------------------------------------------------------
      - name: Configure (baseline)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          cmake -S . -B build/baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DVC_QUICKBUILD_OPT_LEVEL=0 \
            -DVC_TESTING=OFF \
            -DVC_BUILD_APPS=ON \
            -DVC_BUILD_FLATBOI=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee ../../ci-out/configure-baseline.log

      - name: Build vc_render_tifxyz (baseline)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          /usr/bin/time -v cmake --build build/baseline --target vc_render_tifxyz --parallel "$(nproc)" \
            2>&1 | tee ../../ci-out/build-baseline.log
          test -x build/baseline/bin/vc_render_tifxyz
          # The binary stays in the build tree: upstream links the vc_* libraries
          # as shared objects with an $ORIGIN/../lib rpath, so copying the
          # executable elsewhere makes it unresolvable ("libvc_flattening.so:
          # cannot open shared object file"). Keep every invocation in place.
          ls -l build/baseline/bin/vc_render_tifxyz | tee -a ../../ci-out/build-baseline.log

      # ---------------------------------------------------------------------
      # Patched: the same commit with our three-file patch applied by git apply.
      # (PATCH_FILES below asserts the count, so this comment cannot drift again:
      #  it read "one-file" until 2026-09-18, while the patch touched the
      #  renderer plus Zarr.hpp and Zarr.cpp.)
      # The revision is detached and clean, so --check proves the patch applies.
      # ---------------------------------------------------------------------
      - name: Apply patch to the pinned revision
        run: |
          set -euo pipefail
          git -C villa-src apply --check --verbose \
            "$GITHUB_WORKSPACE/patch/vc_render_tifxyz.patch" \
            2>&1 | tee ci-out/apply-patch.log
          git -C villa-src apply \
            "$GITHUB_WORKSPACE/patch/vc_render_tifxyz.patch"
          git -C villa-src diff --stat | tee -a ci-out/apply-patch.log
          git -C villa-src diff --output="$GITHUB_WORKSPACE/ci-out/applied.diff"
          # Count the touched files explicitly. The committed artefact covers
          # three: the renderer plus Zarr.hpp and Zarr.cpp. This assertion is
          # here because the patch-regeneration command documented in AGENTS.md
          # §4 named only one path until 2026-09-18, which silently produced a
          # patch that dropped both Zarr hunks while still round-tripping.
          PATCH_FILES="$(git -C villa-src diff --name-only | wc -l)"
          echo "PATCH_FILES=$PATCH_FILES" | tee -a ci-out/apply-patch.log
          if [ "$PATCH_FILES" -ne 3 ]; then
            echo "PATCH_FILE_COUNT_UNEXPECTED: expected 3, got $PATCH_FILES" \
              | tee -a ci-out/apply-patch.log
            exit 1
          fi
          # The applied diff must be byte-identical to the committed artefact.
          # This compares the artefact with what the pinned revision produces when
          # the patch is applied, and it is asserted rather than merely logged:
          # until 2026-09-18 it only printed the verdict, so a mismatch would have
          # produced a green run whose "patched" binary was built from something
          # other than the committed patch.
          if cmp -s "$GITHUB_WORKSPACE/ci-out/applied.diff" \
                    "$GITHUB_WORKSPACE/patch/vc_render_tifxyz.patch"; then
            echo "PATCH_IDENTICAL=yes" | tee -a ci-out/apply-patch.log
          else
            echo "PATCH_IDENTICAL=no" | tee -a ci-out/apply-patch.log
            echo "FATAL: the applied diff differs from patch/vc_render_tifxyz.patch." \
              "Everything below would be evidence about a different change."
            exit 1
          fi

      - name: Configure (patched)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          cmake -S . -B build/patched -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DVC_QUICKBUILD_OPT_LEVEL=0 \
            -DVC_TESTING=OFF \
            -DVC_BUILD_APPS=ON \
            -DVC_BUILD_FLATBOI=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee ../../ci-out/configure-patched.log

      - name: Build vc_render_tifxyz (patched)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          /usr/bin/time -v cmake --build build/patched --target vc_render_tifxyz --parallel "$(nproc)" \
            2>&1 | tee ../../ci-out/build-patched.log
          test -x build/patched/bin/vc_render_tifxyz
          ls -l build/patched/bin/vc_render_tifxyz | tee -a ../../ci-out/build-patched.log

      - name: Install TIFF and metadata inspection tooling
        # Must come BEFORE the edge-case step: that step reads TIFF resolution tags,
        # and without Pillow it reports "the TIFF has no resolution" instead of
        # "the tool is missing". Both users below are downstream of this step.
        #
        # --break-system-packages: ubuntu-24.04 marks its Python as externally
        # managed (PEP 668), so a plain `pip install` is refused. A venv would be
        # tidier but this is a throwaway runner.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libtiff-tools >/dev/null 2>&1 || true
          python3 -m pip install --quiet --disable-pip-version-check \
            --break-system-packages Pillow
          python3 -c "from PIL import Image; print('Pillow', Image.__version__)"
          command -v tiffinfo >/dev/null && echo "tiffinfo present" || echo "(tiffinfo unavailable)"

      - name: Capture --help from both binaries and compare
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          BASE=build/baseline/bin/vc_render_tifxyz
          PATCHED=build/patched/bin/vc_render_tifxyz
          "$BASE"    --help > ../../ci-out/help-baseline.txt 2>&1
          "$PATCHED" --help > ../../ci-out/help-patched.txt  2>&1
          echo "baseline --help: $(wc -l < ../../ci-out/help-baseline.txt) lines"
          echo "patched  --help: $(wc -l < ../../ci-out/help-patched.txt) lines"
          if diff -u ../../ci-out/help-baseline.txt ../../ci-out/help-patched.txt \
               > ../../ci-out/help.diff; then
            echo "HELP_IDENTICAL=yes" | tee ../../ci-out/help.diff
          else
            echo "HELP_IDENTICAL=no (see help.diff)"
          fi
          cat ../../ci-out/help.diff
          echo "--- the two flags that must be unchanged ---"
          grep -E -- '--voxel-size|--voxel-unit' ../../ci-out/help-patched.txt

      # ---------------------------------------------------------------------
      # Public inputs: one tifxyz mesh sized for the 8.64 um volume, and a second
      # on the legacy volume that already worked.
      # ---------------------------------------------------------------------
      - name: Fetch public segment meshes
        run: |
          set -euo pipefail
          mkdir -p data
          BUCKET=s3://vesuvius-challenge-open-data
          aws s3 cp --no-sign-request --recursive \
            "$BUCKET/PHerc0009B/segments/20250510172639/mesh/20250510172639-on-20250521125136-8.64um.tifxyz/" \
            data/seg-0009B-8.64um.tifxyz/ 2>&1 | tail -5
          aws s3 cp --no-sign-request --recursive \
            "$BUCKET/PHerc0172/segments/20250917143559-w062_20250917143559205_flatboi/mesh/20250917143559-on-20241024131838-7.91um.tifxyz/" \
            data/seg-0172-7.91um.tifxyz/ 2>&1 | tail -5
          find data -type f | sort | tee ci-out/segments.txt
          cat data/seg-0009B-8.64um.tifxyz/meta.json

      - name: Write local cache-dir markers (deliberately NO store metadata)
        # The renderer caches remote chunks into --volume. A .remote_source.json
        # marker lets a run resolve the URL without --remote-url; writing it up
        # front means both binaries take the identical code path, so the only
        # variable between them is the patch.
        #
        # The cache dir deliberately does NOT contain meta.json or metadata.json.
        # That is the whole experiment: with no store document on the local
        # filesystem, the shipped reader finds nothing (the defect) and the
        # patched one falls back to the volume it has already opened (the fix).
        # Copying metadata.json in here would make the BASELINE resolve 8.64 as
        # well and would compare nothing.
        run: |
          set -euo pipefail
          BUCKET=https://vesuvius-challenge-open-data.s3.amazonaws.com
          mkdir -p vol-cache/0009B vol-cache/0172 data

          write_marker() {
            printf '{"url": "%s"}\n' "$2" > "$1/.remote_source.json"
          }
          write_marker vol-cache/0009B \
            "$BUCKET/PHerc0009B/volumes/20250521125136-8.640um-1.2m-116keV-masked.zarr/"
          write_marker vol-cache/0172 \
            "$BUCKET/PHerc0172/volumes/20241024131838-7.910um-53keV-masked.zarr/"

          # The store documents are kept OUTSIDE the cache dirs, only so the
          # report can show what the store actually says.
          curl -fsS "$BUCKET/PHerc0009B/volumes/20250521125136-8.640um-1.2m-116keV-masked.zarr/metadata.json" \
            -o data/store-0009B-metadata.json
          curl -fsS "$BUCKET/PHerc0172/volumes/20241024131838-7.910um-53keV-masked.zarr/meta.json" \
            -o data/store-0172-meta.json

          python3 - <<'PY' | tee ci-out/store-voxel-size.txt
          import json, pathlib
          for name, path in (("PHerc0009B 8.64um", "data/store-0009B-metadata.json"),
                             ("PHerc0172 7.91um",  "data/store-0172-meta.json")):
              doc = json.loads(pathlib.Path(path).read_text())
              sps = (doc.get("scan", {}).get("tomo", {}).get("acquisition", {})
                        .get("detector", {}).get("samplePixelSize"))
              top = doc.get("voxelsize")
              print(f"{name}: samplePixelSize={sps} mm  top-level voxelsize={top}")
          PY
          ls -l vol-cache/*/.remote_source.json

      # ---------------------------------------------------------------------
      # Render: identical inputs, identical parameters, both binaries.
      # ---------------------------------------------------------------------
      - name: Render with both binaries (PHerc0009B, 8.64 um)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"
          COMMON=(-g 0 --scale 1 -n 1 --cache-gb 4
                  --crop-x 3145 --crop-y 3412 --crop-width 128 --crop-height 128)
          run() {
            local bin="$1" tag="$2"
            set +e
            "$bin" -v "$W/vol-cache/0009B" \
              -s "$W/data/seg-0009B-8.64um.tifxyz" \
              "${COMMON[@]}" \
              --zarr-output "$W/out/${tag}.zarr" \
              --tif-output "$W/out/${tag}.tif" \
              > "$W/ci-out/render-${tag}.log" 2>&1
            echo "$?" > "$W/ci-out/render-${tag}.exit"
            set -e
            echo "=== $tag exit $(cat "$W/ci-out/render-${tag}.exit") ==="
            cat "$W/ci-out/render-${tag}.log"
          }
          mkdir -p "$W/out"
          run build/baseline/bin/vc_render_tifxyz 0009B-baseline
          run build/patched/bin/vc_render_tifxyz  0009B-patched

      - name: Render with both binaries (PHerc0172, legacy 7.91 um control)
        working-directory: villa-src/volume-cartographer
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"
          COMMON=(-g 0 --scale 1 -n 1 --cache-gb 4 --crop-width 128 --crop-height 128)
          run() {
            local bin="$1" tag="$2"
            set +e
            "$bin" -v "$W/vol-cache/0172" \
              -s "$W/data/seg-0172-7.91um.tifxyz" \
              "${COMMON[@]}" \
              --zarr-output "$W/out/${tag}.zarr" \
              --tif-output "$W/out/${tag}.tif" \
              > "$W/ci-out/render-${tag}.log" 2>&1
            echo "$?" > "$W/ci-out/render-${tag}.exit"
            set -e
            echo "=== $tag exit $(cat "$W/ci-out/render-${tag}.exit") ==="
            cat "$W/ci-out/render-${tag}.log"
          }
          run build/baseline/bin/vc_render_tifxyz 0172-baseline
          run build/patched/bin/vc_render_tifxyz  0172-patched

      - name: Unknown-size branch (patched binary, real CLI)
        # The branch that warns and must declare NO physical scale: a volume that
        # opens and renders, but whose voxel size cannot be resolved from anywhere.
        #
        # Reaching it takes care, and two earlier attempts at this step did not.
        # An empty cache dir exits before resolution ("cannot detect version"), and
        # a cache dir carrying .remote_source.json streams the real store, whose
        # document states 8.64 um -- so the branch was never entered in either.
        #
        # The working construction is a purely LOCAL store: no .remote_source.json,
        # so no Volume is opened and no remote document is fetched; a valid .zarray
        # so the local pyramid opens; and NO metadata.json or meta.json, so
        # resolveLocalStoreVoxelSize() finds nothing. That is the unresolved case.
        working-directory: villa-src/volume-cartographer
        run: |
          set -uo pipefail
          W="$GITHUB_WORKSPACE"
          CACHE="$W/vol-cache/nosize"
          rm -rf "$CACHE"; mkdir -p "$CACHE/0" "$W/out/unknown"
          printf '{"shape":[1,1,1],"chunks":[128,128,128],"fill_value":0,"order":"C","filters":null,"dimension_separator":"/","compressor":null,"zarr_format":2,"dtype":"|u1"}' \
            > "$CACHE/0/.zarray"
          printf '{"zarr_format":2}' > "$CACHE/.zgroup"
          head -c 1 /dev/zero > "$CACHE/0/0"
          echo "local store built (deliberately with NO metadata.json):"
          find "$CACHE" -type f | sort

          run_unknown() {
            local bin="$1" tag="$2"
            set +e
            "$bin" -v "$CACHE" \
              -s "$W/data/seg-0009B-8.64um.tifxyz" \
              -g 0 --scale 1 -n 1 --cache-gb 1 \
              --crop-x 3145 --crop-y 3412 --crop-width 32 --crop-height 32 \
              --zarr-output "$W/out/unknown/${tag}.zarr" \
              --tif-output "$W/out/unknown/${tag}.tif" \
              > "$W/ci-out/unknown-${tag}.log" 2>&1
            echo "$?" > "$W/ci-out/unknown-${tag}.exit"
            set -e
            echo "=== ${tag} exit $(cat "$W/ci-out/unknown-${tag}.exit") ==="
            grep -E "Voxel size|Warning|physical scale|Error|Detected cached" \
              "$W/ci-out/unknown-${tag}.log" || echo "  (no voxel-size line)"
          }
          run_unknown build/patched/bin/vc_render_tifxyz  patched-unknown
          run_unknown build/baseline/bin/vc_render_tifxyz baseline-unknown

          # The branch must actually have been entered, or the check below proves
          # nothing. Both attempts before this one passed vacuously.
          if ! grep -q "publishes no usable voxel size" "$W/ci-out/unknown-patched-unknown.log"; then
            echo "FATAL: the unresolved branch was not reached, so this step proves nothing."
            echo "--- patched log ---"; cat "$W/ci-out/unknown-patched-unknown.log"
            exit 1
          fi
          # And no store document may have been consulted for a remote source.
          if grep -q "Detected cached remote source" "$W/ci-out/unknown-patched-unknown.log"; then
            echo "FATAL: a remote source was used, so this is not the unresolved case."
            exit 1
          fi

          echo
          echo "--- what each one DECLARED ---"
          FAILED=0
          python3 "$W/ci/check_physical_size.py" \
            --zattrs "$W/out/unknown/patched-unknown.zarr/.zattrs" \
            --tiff "$W/out/unknown/patched-unknown.tif" \
            --expect-unknown --label "patched-unknown" || FAILED=1
          echo "--- baseline, for contrast (expected to declare the fabricated 1.0) ---"
          python3 "$W/ci/summarize_zattrs.py" \
            "$W/out/unknown/baseline-unknown.zarr/.zattrs" 2>/dev/null \
            | sed 's/^/    baseline declares: /' || true
          python3 "$W/ci/check_physical_size.py" \
            --zattrs "$W/out/unknown/baseline-unknown.zarr/.zattrs" \
            --tiff "$W/out/unknown/baseline-unknown.tif" \
            --expect-unknown --label "baseline-unknown" \
            | sed 's/^/    /' || true
          if [ "$FAILED" -ne 0 ]; then
            echo "FATAL: the unknown-size branch declared a physical scale."
            exit 1
          fi
          exit 0

      - name: Error and edge cases (patched binary, real CLI)
        # The user-facing question is not "does the function handle 0" but "can the
        # program ever quietly assert a physical scale that does not exist". These
        # drive the real binary and check its exit code and output.
        working-directory: villa-src/volume-cartographer
        run: |
          set -uo pipefail
          W="$GITHUB_WORKSPACE"
          BIN=build/patched/bin/vc_render_tifxyz
          BASE=build/baseline/bin/vc_render_tifxyz
          mkdir -p "$W/out/err"
          OUT="$W/ci-out/edge-cases.txt"
          : > "$OUT"

          # run_case <label> <expected-exit> <expected-um|-> <bin> <extra args...>
          #
          # When the run is expected to SUCCEED, <expected-um> is the physical voxel
          # size in micrometres that the command line asked for. The .zattrs number
          # and unit and the TIFF resolution are then each converted to micrometres
          # and checked against it. Exit codes alone cannot see a number/unit
          # mismatch -- which is exactly the defect this step was extended for.
          run_case() {
            local label="$1" want="$2" expect_um="$3" bin="$4"; shift 4
            set +e
            "$bin" -v "$W/vol-cache/0009B" -s "$W/data/seg-0009B-8.64um.tifxyz" \
              -g 0 --scale 1 -n 1 --cache-gb 1 \
              --crop-x 3145 --crop-y 3412 --crop-width 32 --crop-height 32 \
              --zarr-output "$W/out/err/${label}.zarr" \
              --tif-output "$W/out/err/${label}.tif" "$@" \
              > "$W/ci-out/edge-${label}.log" 2>&1
            local rc=$?
            set -e
            local verdict="UNEXPECTED"
            [ "$rc" -eq "$want" ] && verdict="as-expected"
            {
              echo "### ${label}"
              echo "    args      : $*"
              echo "    exit      : ${rc} (wanted ${want}) -- ${verdict}"
              echo "    log lines :"
              grep -E "Voxel size|Error|Warning|physical scale" "$W/ci-out/edge-${label}.log" \
                | sed 's/^/      /' || echo "      (none)"
              local attrs
              attrs=$(python3 "$W/ci/summarize_zattrs.py" \
                        "$W/out/err/${label}.zarr/.zattrs" 2>/dev/null \
                      || echo "(no .zattrs)")
              printf '    .zattrs   %s\n' "${attrs}"
            } >> "$OUT"

            if [ "$expect_um" != "-" ]; then
              set +e
              python3 "$W/ci/check_physical_size.py" \
                --zattrs "$W/out/err/${label}.zarr/.zattrs" \
                --tiff "$W/out/err/${label}.tif" \
                --expect-um "$expect_um" --label "$label" \
                >> "$OUT" 2>&1
              local phys=$?
              set -e
              echo "    physical check exit: ${phys}" >> "$OUT"
              if [ "$phys" -ne 0 ]; then PHYS_FAILURES=1; fi
            fi
            echo >> "$OUT"
          }

          # NB: no trailing arithmetic -- `$((x+1))` returns the new value, and a
          # value of 0 would trip `set -e`. A plain assignment of 1 is safe.
          PHYS_FAILURES=0
          echo "voxel-size resolution edge cases" >> "$OUT"
          echo "=================================" >> "$OUT"
          echo >> "$OUT"

          # Every case runs even if one fails: `set +e` around this section, because
          # `set -e` would abort on the first failing check and throw away the
          # report that says WHICH physical size was wrong. The accumulated flag is
          # what decides the step's outcome at the end.
          set +e

          # No usable metadata anywhere is NOT reachable with this volume: the
          # patched binary finds the value in the volume it opened. That is the
          # fix. The remaining cases below force the unusable paths instead.
          run_case "zero-size"        1 - "$BIN" --voxel-size 0
          run_case "negative-size"    1 - "$BIN" --voxel-size -3
          run_case "nan-size"         1 - "$BIN" --voxel-size nan
          run_case "unknown-unit"     1 - "$BIN" --voxel-size 7.91 --voxel-unit furlong

          # Same physical size, expressed four ways. All four must declare and
          # resolve to 8.64 um. The nanometer case is the one the first version of
          # the patch got wrong (it declared 8.64 nm).
          run_case "explicit-nm"      0 8.64 "$BIN" --voxel-size 8640  --voxel-unit nanometer
          run_case "explicit-um"      0 8.64 "$BIN" --voxel-size 8.64  --voxel-unit micrometer
          run_case "explicit-mm"      0 8.64 "$BIN" --voxel-size 0.00864 --voxel-unit millimeter
          run_case "explicit-m"       0 8.64 "$BIN" --voxel-size 0.00000864 --voxel-unit meter
          # Physically different size: 7.91 um, to show the check is not just
          # asserting a constant.
          run_case "explicit-nm-7910" 0 7.91 "$BIN" --voxel-size 7910 --voxel-unit nanometer

          # The baseline, for contrast: it too rejects a non-positive size, so the
          # difference between the binaries is not in input validation but in
          # whether a value is found at all when none is given.
          run_case "baseline-zero-size" 1 - "$BASE" --voxel-size 0
          set -e

          echo "--- results ---"
          cat "$OUT"
          echo
          echo "physical-size failures: ${PHYS_FAILURES}"
          if [ "$PHYS_FAILURES" -ne 0 ]; then
            echo "FATAL: a declared physical size did not match what was requested."
            exit 1
          fi
          exit 0

      - name: Inspect emitted metadata and pixels
        run: |
          set -euo pipefail
          python3 ci/compare_render_outputs.py out ci-out | tee ci-out/comparison.txt
          echo
          echo "=== tiffinfo on the first slice of each run (independent tool) ==="
          # --tif-output names a DIRECTORY, and that directory is itself called
          # "<tag>.tif". So `find <dir> -name '*.tif'` returns the DIRECTORY --
          # which tiffinfo rejects as "Cannot read TIFF header" -- before it ever
          # lists the slices inside. `-type f` is what makes this find files.
          for t in 0009B-baseline 0009B-patched 0172-baseline 0172-patched; do
            first=$(find "out/${t}.tif" -type f -name '*.tif' 2>/dev/null | sort | head -1 || true)
            echo "--- ${t}: ${first:-<none>}"
            if [ -n "${first}" ]; then tiffinfo "${first}" 2>&1 | head -20 || true; fi
          done | tee ci-out/tiffinfo.txt
          echo
          echo "=== resolution tags, as read by tiffinfo rather than by Pillow ==="
          grep -E '^---|Resolution' ci-out/tiffinfo.txt

      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-validation
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci-out/
            out/
